# E4 confirmatory suite: the DSSAT seen-control T3.2 schema tuple.
#
# "Seen control" means the schema tuple appeared during T3.2 training, not that
# the scenarios did. The submitted dssat_yield tuple trains on seeds 42-441 and
# validates on 100042-100169; this suite uses the disjoint 200042-200169 block,
# which is the same block as e4_t32_dssat_profit. Sharing the block makes the
# seen and held-out DSSAT cells paired over identical scenarios, so the only
# difference between them is the reward formulation.
env_name: gym_dssat
dataset_id: e4_t32_dssat_yield
validation_axis: schema_tuple

sampling:
  generation_seed: 20260725
  splits:
    test:
      role: test
      validation_set: seen_dssat_yield
      labels:
        schema_tuple: dssat_yield
        simulator: gym_dssat
        observation_schema: dssat_native
        action_menu: dssat_native
        action_schema: dssat_native
        reward_formulation: yield_max
        callback_family: seen_control

env_id: maize-irrigation-v0
llm_mode: true
include_crop_traits: false
require_think: false
thinking_mode: grounding_decision
think_tag: tool_call
objective_id: yield_max
turn_num: 24
decision_interval: 10
num_seasons: 1
crop_name: maize

env_params:
  mode: all

test_seeds:
  count: 128
  base_seed: 200042

soil_variation:
  enabled: false

trajectory_group_labels:
  schema_tuple: dssat_yield
  simulator: gym_dssat
  observation_schema: dssat_native
  action_menu: dssat_native
  action_schema: dssat_native
  reward_formulation: yield_max
  callback_family: seen_control
