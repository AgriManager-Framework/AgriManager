# E4 confirmatory suite: the three WOFOST seen-control T3.2 schema tuples.
#
# "Seen control" means the schema tuple appeared during T3.2 training, not that
# the scenarios did. These splits therefore reuse the same frozen maize_e4 base
# as the held-out suite and the T2.1/T2.2 suites, so every T3.2 comparison —
# seen versus held-out, and unified policy versus specialists — is paired over
# identical physical scenarios.
#
# Labels and env overrides mirror the submitted val_wofost_* splits in
# experiments/t3_2_unified_prompt_conditioned_policy/config/t32_unified_wofost.yaml;
# only the scenario source changes.
env_name: wofost_gym
dataset_id: e4_t32_wofost_seen
validation_axis: schema_tuple

source:
  kind: weather_pool
  path: experiments/rebuttal_confirmatory_eval/data/source_pools/maize_e4

sampling:
  generation_seed: 20260725
  scenario_sets:
    eval_base:
      source_split: test
      crops: [maize]
      num_samples: 128

  splits:
    test_wofost_lnpkw_profit:
      role: test
      validation_set: seen_wofost_lnpkw_profit
      scenario_set: eval_base
      labels:
        schema_tuple: wofost_s1_lnpkw_profit
        simulator: wofost_gym
        observation_schema: S1_full_current
        action_menu: lnpkw
        action_schema: lnpkw
        reward_formulation: profit_max
        callback_family: seen_control
      env:
        env_id: lnpkw-v0
        objective_id: profit_max
        prompt_objective_id: profit_max

    test_wofost_lnpk_profit:
      role: test
      validation_set: seen_wofost_lnpk_profit
      scenario_set: eval_base
      labels:
        schema_tuple: wofost_s1_lnpk_profit
        simulator: wofost_gym
        observation_schema: S1_full_current
        action_menu: lnpk
        action_schema: lnpk
        reward_formulation: profit_max
        callback_family: seen_control
      env:
        env_id: lnpk-v0
        objective_id: profit_max
        prompt_objective_id: profit_max

    test_wofost_lnw_yield:
      role: test
      validation_set: seen_wofost_lnw_yield
      scenario_set: eval_base
      labels:
        schema_tuple: wofost_s1_lnw_yield
        simulator: wofost_gym
        observation_schema: S1_full_current
        action_menu: lnw
        action_schema: lnw
        reward_formulation: yield_max
        callback_family: seen_control
      env:
        env_id: lnw-v0
        objective_id: yield_max
        prompt_objective_id: yield_max

env:
  env_id: lnpkw-v0
  wofost_gym_path: ../AgriManagerExternal/WOFOSTGym
  llm_mode: true
  intvn_interval: 10
  turn_num: 24
  scale_action_amounts_by_interval: true
  objective_id: profit_max
  prompt_objective_id: profit_max
  y_ref: 8500.0
  reward_params:
    cost_n: 3.5
    cost_p: 5.5
    cost_k: 2.25
    cost_water: 0.05
    c_w: 0.05
    tau_y: 0.80
    water_budget_mm: 500.0
    lambda_i: 0.10
    beta_y: 4.0
    beta_budget: 2.0
    budget_n_kg_ha: 400.0
    budget_p_kg_ha: 200.0
    budget_k_kg_ha: 200.0
    terminal_nutrient_min: 8.0
    terminal_nutrient_max: 50.0
    beta_application: 0.35
    beta_low: 0.30
    beta_high: 0.50
  include_crop_traits: false
  require_think: false
  thinking_mode: grounding_decision
  think_tag: tool_call
  observation_schema_name: S1_full_current
  prompt_observation_fields: [FIN, DVS, WSO, NAVAIL, PAVAIL, KAVAIL, SM, TOTN, TOTP, TOTK, TOTIRRIG, IRRAD, TEMP, RAIN, DAYS]
