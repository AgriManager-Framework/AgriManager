# E4 confirmatory suite, v2: the CycleGym seen-control T3.2 schema tuple (yield).
#
# Why v2. The v1 suite kept the submitted validation years (1996-2003) and moved
# only the seed block, on the assumption that the seed makes scenarios differ.
# It does not: CornShortRockSpringsFW-v1 runs historical weather at a single
# site, so a scenario is physically its year and nothing else. v1 was therefore
# the validation set's eight years, sixteen copies each, and its audit, which
# keyed scenarios on the seed, could not see that (docs/benchmark/test_suite.md
# records the rebuild).
#
# v2 uses every RockSprings weather year no CycleGym experiment has touched:
# 2004-2016, thirteen years. Training (T3.1 and T3.2) uses 1980-1995 and
# validation 1996-2003. Ten seeds per year give 130 rows; the copies carry no
# physical difference and exist only to average the policy's own sampling.
# The three v2 suites share the block, so T3.1, T3.2 profit and T3.2 yield stay
# paired over identical scenarios. audit_cycles_v2_eval_suites.py checks all of
# this on the physical key (env_id, year), not on the seed.
#
# Everything else is v1 unchanged.
env_name: cycles_gym
dataset_id: e4_t32_cycles_yield_v2
validation_axis: schema_tuple

sampling:
  generation_seed: 20260926
  splits:
    test:
      role: test
      validation_set: seen_cycles_yield
      labels:
        schema_tuple: cycles_yield
        simulator: cycles_gym
        observation_schema: cycles_native
        action_menu: cycles_native
        action_schema: cycles_native
        reward_formulation: yield_max
        callback_family: seen_control

base_config:
  env_id: CornShortRockSpringsFW-v1
  cycles_gym_path: ../AgriManagerExternal/CyclesGym
  llm_mode: true
  objective_id: yield_max
  include_crop_traits: false
  require_think: false
  thinking_mode: grounding_decision
  think_tag: tool_call
  turn_num: 26
  trajectory_group_labels:
    schema_tuple: cycles_yield
    simulator: cycles_gym
    observation_schema: cycles_native
    action_menu: cycles_native
    action_schema: cycles_native
    reward_formulation: yield_max
    callback_family: seen_control
  env_kwargs:
    delta: 10
    n_actions: 11
    maxN: 150
    start_year: 2004
    end_year: 2004

test_generation:
  env_ids: [CornShortRockSpringsFW-v1]
  year_windows:
    - [2004, 2004]
    - [2005, 2005]
    - [2006, 2006]
    - [2007, 2007]
    - [2008, 2008]
    - [2009, 2009]
    - [2010, 2010]
    - [2011, 2011]
    - [2012, 2012]
    - [2013, 2013]
    - [2014, 2014]
    - [2015, 2015]
    - [2016, 2016]
  seeds_per_combo: 10
  seed_start: 300042
