# E4 confirmatory suite: the T1.3 Cycles price-regime axis.
#
# T1.3 is a distributional shift in prices, not in schema. A policy trains on
# corn and soybean prices drawn from the base triangular distributions and is
# then asked to manage a 19-year rotation under a price shock it never saw:
#
#   id_test        base prices, the seen control
#   high_corn      corn shocked to 380/430/480
#   high_soybean   soybean shocked to 420/470/520
#
# The three regimes share a `paired_scenario_id`, so they run the identical
# weather years, fields and seeds and differ only in the price vector. That
# pairing is what makes the shock effect a within-scenario difference rather
# than a comparison of two samples.
#
# Both the regime definitions and the year windows are copied verbatim from
# `val_generation` in
# experiments/t1_3_cycles_gym_price_regime/config/price_regime_llm_think.yaml.
# Only the stochastic seed block moves, from 200000 to 300000. The submitted
# validation block consumes seeds 200000-200127 (8 env-window combos of 16), so
# 300000 is unambiguously fresh, while keeping the validation year range means
# no new weather-year distribution is introduced and the eval stays clear of
# the 1980-2001 training windows.
env_name: cycles_gym
dataset_id: e4_t13_price_regime
validation_axis: price_regime

sampling:
  generation_seed: 20260725
  splits:
    test:
      role: test
      validation_set: price_regime
      labels:
        validation_axis: price_regime
        simulator: cycles_gym

base_config:
  env_id: CropPlanningRockSpringsRW-v1
  cycles_gym_path: ../AgriManagerExternal/CyclesGym
  llm_mode: true
  objective_id: profit_max
  require_think: false
  thinking_mode: grounding_decision
  think_tag: tool_call
  valid_action_bonus: 0.1
  invalid_action_fallback: heuristic
  reward_scale: 1000.0
  reward_params:
    crop_planning_same_crop_penalty: 0.05
    crop_planning_same_crop_penalty_cap: 0.4
    crop_planning_cereal_run_penalty: 0.02
    crop_planning_legume_break_bonus: 0.03
    crop_planning_cereal_after_legume_bonus: 0.02
    crop_planning_change_crop_bonus: 0.01
  turn_num: 19
  trajectory_group_labels:
    validation_axis: price_regime
    simulator: cycles_gym
    observation_schema: cycles_native
    action_menu: cycles_native
    action_schema: cycles_native
    reward_formulation: profit_max
  env_kwargs:
    rotation_crops:
      - CornRM.100
      - SoybeanMG.3
    crop_price_sampling:
      CornRM.100:
        min: 220.0
        mode: 250.0
        max: 280.0
      SoybeanMG.3:
        min: 260.0
        mode: 300.0
        max: 340.0

test_generation:
  env_ids:
    - CropPlanningRockSpringsRW-v1
    - CropPlanningNewHollandRW-v1
  year_windows:
    - [1986, 2004]
    - [1987, 2005]
    - [1988, 2006]
    - [1989, 2007]
  seeds_per_combo: 16
  seed_start: 300000
  paired_price_regimes:
    regimes:
      id_test:
        metadata:
          regime_family: id
      high_corn:
        crop_price_sampling_overrides:
          CornRM.100:
            min: 380.0
            mode: 430.0
            max: 480.0
        metadata:
          regime_family: ood
          shocked_crop: CornRM.100
      high_soybean:
        crop_price_sampling_overrides:
          SoybeanMG.3:
            min: 420.0
            mode: 470.0
            max: 520.0
        metadata:
          regime_family: ood
          shocked_crop: SoybeanMG.3
