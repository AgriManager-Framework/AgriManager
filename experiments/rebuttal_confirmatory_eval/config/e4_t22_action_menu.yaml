env_name: wofost_gym
dataset_id: e4_t22_action_menu
validation_axis: action_menu

source:
  kind: weather_pool
  path: experiments/rebuttal_confirmatory_eval/data/source_pools/maize_e4

sampling:
  generation_seed: 20260725
  scenario_sets:
    eval_base:
      source_split: test
      crops: [maize]
      num_samples: 128

  splits:
    test_lnw:
      role: test
      validation_set: lnw
      scenario_set: eval_base
      labels:
        action_menu: lnw
        action_schema: lnw
        prompt_condition: clean
      env:
        env_id: lnw-v0

    test_ln:
      role: test
      validation_set: ln
      scenario_set: eval_base
      labels:
        action_menu: ln
        action_schema: ln
        prompt_condition: clean
      env:
        env_id: ln-v0

    test_lw:
      role: test
      validation_set: lw
      scenario_set: eval_base
      labels:
        action_menu: lw
        action_schema: lw
        prompt_condition: clean
      env:
        env_id: lw-v0

    test_lnpkw:
      role: test
      validation_set: lnpkw
      scenario_set: eval_base
      labels:
        action_menu: lnpkw
        action_schema: lnpkw
        prompt_condition: clean
      env:
        env_id: lnpkw-v0

env:
  env_id: lnpkw-v0
  wofost_gym_path: ../AgriManagerExternal/WOFOSTGym
  llm_mode: true
  intvn_interval: 10
  turn_num: 24
  scale_action_amounts_by_interval: true
  objective_id: profit_max
  reward_params:
    cost_n: 3.5
    cost_p: 5.5
    cost_k: 2.25
    cost_water: 0.05
  include_crop_traits: false
  require_think: false
  thinking_mode: think
  think_tag: tool_call

