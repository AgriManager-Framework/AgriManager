# E4 confirmatory suite: the gym-DSSAT target cell of the T3.1 cross-simulator axis.
#
# The submitted T3.1 DSSAT cell trains on seeds 42-1641 and validates on
# 100042-100169. This suite uses the disjoint 200042-200169 block, which is the
# same block the T3.2 DSSAT suites use, so the T3.1 and T3.2 DSSAT numbers are
# paired over identical scenarios. The audit checks that rather than stating it.
#
# The env block is copied from
# experiments/t3_1_cross_simulator_maize_transfer/config/t31_cross_sim_gym_dssat.yaml.
env_name: gym_dssat
dataset_id: e4_t31_cross_sim_dssat
validation_axis: simulator

sampling:
  generation_seed: 20260725
  splits:
    test:
      role: test
      validation_set: dssat
      labels:
        simulator: gym_dssat
        observation_schema: dssat_native
        action_menu: dssat_native
        action_schema: dssat_native
        reward_formulation: profit_max

env_id: maize-irrigation-v0
llm_mode: true
include_crop_traits: false
require_think: false
thinking_mode: grounding_decision
think_tag: tool_call
objective_id: profit_max
reward_params:
  cost_n: 3.5
  cost_p: 5.5
  cost_k: 2.25
  cost_water: 0.05
turn_num: 24
decision_interval: 10
num_seasons: 1
crop_name: maize

env_params:
  mode: all

test_seeds:
  count: 128
  base_seed: 200042

soil_variation:
  enabled: false

trajectory_group_labels:
  simulator: gym_dssat
  observation_schema: dssat_native
  action_menu: dssat_native
  action_schema: dssat_native
  reward_formulation: profit_max
