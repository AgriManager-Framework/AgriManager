# Frozen confirmatory test suite for T1.1 Potato.
#
# Renders the five weather-regime groups that the submitted T1.1 experiment
# reports (in-distribution plus drought, wet, hot, and cold) from the frozen
# pool that `prepare_t11_potato_eval_pool.py` already selected. Each group
# holds 128 scenarios that no T1.1 training or validation split contains, which
# is what makes this a test set rather than the reused validation set the
# meta-review objected to.
#
# The `env` block mirrors `weather_regime_potato_llm_without_traits_think.yaml`
# exactly except for `require_think`. The suite is policy-neutral: the E5
# evaluation applies the Think or No-think override that belongs to each
# checkpoint, and should assert the override matches the checkpoint rather than
# trusting this default.
#
# `e4_t11_potato_weather_regime_nn.yaml` renders the same scenarios with
# `llm_mode: false`, so LLM and numerical policies are scored on identical
# scenarios and the comparison is paired.
#
# Do not regenerate the source pool from this config; it consumes the pool that
# `prepare_t11_potato_eval_pool.py` froze.

env_name: wofost_gym
dataset_id: e4_t11_potato_weather_regime
validation_axis: weather_regime

source:
  kind: weather_pool
  path: experiments/rebuttal_confirmatory_eval/data/source_pools/t11_potato_e4

sampling:
  generation_seed: 20260725
  scenario_sets:
    eval_id:
      source_split: test_id
      crops: [potato]
      num_samples: 128
    eval_drought:
      source_split: test_drought
      crops: [potato]
      num_samples: 128
    eval_wet:
      source_split: test_wet
      crops: [potato]
      num_samples: 128
    eval_hot:
      source_split: test_hot
      crops: [potato]
      num_samples: 128
    eval_cold:
      source_split: test_cold
      crops: [potato]
      num_samples: 128

  splits:
    test_id:
      role: test
      validation_set: id
      scenario_set: eval_id
      labels:
        weather_regime: id

    test_drought:
      role: test
      validation_set: drought
      scenario_set: eval_drought
      labels:
        weather_regime: drought

    test_wet:
      role: test
      validation_set: wet
      scenario_set: eval_wet
      labels:
        weather_regime: wet

    test_hot:
      role: test
      validation_set: hot
      scenario_set: eval_hot
      labels:
        weather_regime: hot

    test_cold:
      role: test
      validation_set: cold
      scenario_set: eval_cold
      labels:
        weather_regime: cold

env:
  env_id: lnpkw-v0
  wofost_gym_path: ../AgriManagerExternal/WOFOSTGym
  llm_mode: true
  intvn_interval: 10
  turn_num: 24
  scale_action_amounts_by_interval: true
  objective_id: profit_max
  include_crop_traits: false
  require_think: false
  thinking_mode: think
  think_tag: tool_call
